[project]
name = "nibepi-homeassistant"
version = "0.3.0"
description = "Home Assistant custom integration for NibePi (NIBE heat pumps via MQTT)"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=custom_components.nibepi --cov-report=term-missing"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Mirrors the core rule families Home Assistant enforces.
select = [
  "A", "ASYNC", "B", "BLE", "C4", "D", "E", "F", "FLY", "G", "I", "INP",
  "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "RET", "RSE", "RUF", "S",
  "SIM", "SLF", "T20", "TID", "TRY", "UP", "W",
]
ignore = [
  "D202", "D203", "D213", "E501", "PLR0913", "PLR2004", "S101", "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "SLF001", "INP001", "PLR0917"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.nibepi"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.coverage.report]
fail_under = 90
